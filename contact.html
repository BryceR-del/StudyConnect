
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Join a Study Group</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Join a Study Group</h1>
        <p>Study and learn with other students!</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Join a Group</a>
    </nav>

    <section>
        <h2>Sign Up Form</h2>
        <p>Fill out the form to tell us about yourself.</p>

        <form>

            <fieldset>
                <legend>Your Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name">

                <label for="email">Email:</label>
                <input type="email" id="email" name="email">

                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </fieldset>

            <fieldset>
                <legend>Study Preferences</legend>

                <label for="subject">Choose a Subject:</label>
                <select id="subject" name="subject">
                    <option>Computer Science</option>
                    <option>Math</option>
                    <option>English</option>
                    <option>Business</option>
                    <option>Other</option>
                </select>

                <p>Where do you want to study?</p>

                <input type="radio" id="online" name="place">
                <label for="online">Online</label>

                <input type="radio" id="inperson" name="place">
                <label for="inperson">In person</label>

                <p>Which days are you available?</p>

                <input type="checkbox" id="monday" name="monday">
                <label for="monday">Monday</label>

                <input type="checkbox" id="wednesday" name="wednesday">
                <label for="wednesday">Wednesday</label>

                <input type="checkbox" id="friday" name="friday">
                <label for="friday">Friday</label>

                <label for="message">Additional Comments:</label>
                <textarea id="message" name="message" rows="4"></textarea>

            </fieldset>

            <input type="submit" value="Submit">

        </form>
    </section>

    <footer>
        <p>Study Groups Website | Due Date: October 15th</p>
    </footer>

</body>
</html>
